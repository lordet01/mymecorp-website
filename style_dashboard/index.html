<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://mymecorp.xyz/style_dashboard/">
    <title>myme studio — Style Cards Admin</title>
    <link rel="icon" type="image/x-icon" href="../myme_Design Asset/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../myme_Design Asset/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../myme_Design Asset/favicon/apple-touch-icon.png">
    <meta name="theme-color" content="#050506">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --studio-rose: #F3C7BE;
            --text-dark: #F3F4F6;
            --text-regular: #BCC1CB;
            --text-light: #8E929A;
            --bg: #050506;
            --bg-panel: #161619;
            --border: rgba(243, 199, 190, 0.18);
            --accent: #e8c07a;
            --danger: #f0a0a0;
            --font: 'Outfit', 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; min-height: 100vh; font-family: var(--font);
            background:
                radial-gradient(900px 420px at 12% -10%, rgba(243, 199, 190, 0.14), transparent 55%),
                radial-gradient(700px 380px at 88% 0%, rgba(120, 140, 180, 0.10), transparent 50%),
                var(--bg);
            color: var(--text-dark); -webkit-font-smoothing: antialiased;
        }
        .gate, .dash { max-width: 1240px; margin: 0 auto; padding: 36px 18px 72px; }
        .gate { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .gate-card {
            width: min(420px, 100%);
            background: linear-gradient(180deg, rgba(243, 199, 190, 0.06), transparent 40%), var(--bg-panel);
            border: 1px solid var(--border); border-radius: 20px; padding: 36px 28px 28px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }
        .brand { font-size: 13px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--studio-rose); font-weight: 700; margin-bottom: 10px; }
        h1 { margin: 0 0 8px; font-size: clamp(1.5rem, 3vw, 1.9rem); font-weight: 700; letter-spacing: -0.02em; }
        .sub { margin: 0 0 28px; color: var(--text-regular); font-size: 0.95rem; line-height: 1.55; }
        label { display: block; font-size: 0.8rem; color: var(--text-light); margin-bottom: 8px; }
        input[type="password"], input[type="text"], input[type="search"], select, textarea {
            width: 100%; border: 1px solid var(--border); background: #0b0b0d; color: var(--text-dark);
            border-radius: 12px; padding: 12px 14px; font: inherit; outline: none;
        }
        textarea { min-height: 88px; resize: vertical; }
        input:focus, select:focus, textarea:focus { border-color: rgba(243, 199, 190, 0.55); box-shadow: 0 0 0 3px rgba(243, 199, 190, 0.12); }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            border: 0; border-radius: 999px; padding: 12px 16px;
            background: linear-gradient(135deg, #F7D5CE 0%, #F3C7BE 45%, #E8B8B0 100%);
            color: #1a1210; font: inherit; font-weight: 700; cursor: pointer;
        }
        .btn:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn.block { width: 100%; margin-top: 16px; }
        .btn.secondary {
            background: transparent; color: var(--text-regular);
            border: 1px solid var(--border); font-weight: 500; font-size: 0.85rem; padding: 8px 12px;
        }
        .btn.danger {
            background: transparent; color: var(--danger);
            border: 1px solid rgba(240, 160, 160, 0.45); font-weight: 600; font-size: 0.85rem; padding: 8px 12px;
        }
        .err { min-height: 1.2em; margin-top: 12px; color: var(--danger); font-size: 0.88rem; }
        .hidden { display: none !important; }
        .top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 20px; flex-wrap: wrap; }
        .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .filters {
            display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)) auto;
            gap: 10px; margin-bottom: 18px; align-items: end;
        }
        @media (max-width: 900px) {
            .filters { grid-template-columns: 1fr 1fr; }
        }
        .meta-bar {
            display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
            color: var(--text-light); font-size: 0.85rem; margin-bottom: 14px;
        }
        .grid {
            display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;
        }
        @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
        .card {
            background: var(--bg-panel); border: 1px solid var(--border); border-radius: 16px; overflow: hidden;
            display: flex; flex-direction: column;
        }
        .thumb-wrap { position: relative; aspect-ratio: 3/4; background: #0b0b0d; }
        .thumb-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
        .thumb-wrap .empty {
            width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
            color: var(--text-light); font-size: 0.85rem;
        }
        .badges { position: absolute; top: 10px; left: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
        .badge {
            font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
            padding: 4px 8px; border-radius: 999px; background: rgba(0,0,0,0.55); color: #fff;
        }
        .badge.new { background: #e85a7a; }
        .badge.burned { background: #6b3a3a; }
        .badge.nocut { background: #5a4a2a; color: #f3e0b0; }
        .card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; flex: 1; }
        .card-title { margin: 0; font-size: 1rem; font-weight: 650; line-height: 1.3; }
        .card-id { margin: 0; color: var(--text-light); font-size: 0.75rem; word-break: break-all; }
        .stats { display: flex; flex-wrap: wrap; gap: 8px 12px; color: var(--text-regular); font-size: 0.8rem; }
        .card-actions { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; padding-top: 4px; }
        .pager { display: flex; justify-content: center; gap: 10px; margin-top: 22px; }
        .drawer-backdrop {
            position: fixed; inset: 0; background: rgba(0,0,0,0.55); z-index: 40;
            display: flex; justify-content: flex-end;
        }
        .drawer {
            width: min(520px, 100%); height: 100%; overflow: auto;
            background: #101013; border-left: 1px solid var(--border); padding: 22px 18px 40px;
            box-shadow: -20px 0 60px rgba(0,0,0,0.4);
        }
        .drawer h2 { margin: 0 0 6px; font-size: 1.2rem; }
        .drawer .row { margin-bottom: 12px; }
        .drawer .prompt {
            white-space: pre-wrap; word-break: break-word; font-size: 0.8rem; line-height: 1.45;
            background: #0b0b0d; border: 1px solid var(--border); border-radius: 12px; padding: 12px;
            max-height: 180px; overflow: auto; color: var(--text-regular);
        }
        .needs { display: flex; flex-wrap: wrap; gap: 8px; }
        .needs label.chip {
            display: inline-flex; align-items: center; gap: 6px; margin: 0;
            border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px;
            font-size: 0.8rem; color: var(--text-regular); cursor: pointer;
        }
        .needs input { width: auto; margin: 0; }
        .drawer-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
        .drawer-thumb { width: 100%; border-radius: 12px; border: 1px solid var(--border); margin: 10px 0 16px; }
        details summary { cursor: pointer; color: var(--text-light); font-size: 0.85rem; margin-bottom: 8px; }
    </style>
</head>
<body>
    <section class="gate" id="gate">
        <div class="gate-card">
            <div class="brand">myme studio</div>
            <h1>Style Cards Admin</h1>
            <p class="sub">라이브 스타일카드 목록·수정·컷 재생성·삭제. Ops 대시보드와 같은 암호입니다.</p>
            <form id="login-form">
                <label for="password">Password</label>
                <input id="password" type="password" autocomplete="current-password" required>
                <button class="btn block" type="submit">Unlock</button>
                <div class="err" id="login-error"></div>
            </form>
        </div>
    </section>

    <main class="dash hidden" id="dash">
        <div class="top">
            <div>
                <div class="brand">myme studio</div>
                <h1>Style Cards</h1>
                <p class="sub" style="margin:0">node2 StyleCardStore · 암호 게이트 전용</p>
            </div>
            <div class="top-actions">
                <button class="btn secondary" type="button" id="btn-refresh">새로고침</button>
                <button class="btn secondary" type="button" id="btn-lock">Lock</button>
            </div>
        </div>

        <div class="filters">
            <div>
                <label for="f-q">검색</label>
                <input id="f-q" type="search" placeholder="card id / 제목">
            </div>
            <div>
                <label for="f-need">Need</label>
                <select id="f-need">
                    <option value="">전체</option>
                    <option value="id">id</option>
                    <option value="apply">apply</option>
                    <option value="profile">profile</option>
                    <option value="dating">dating</option>
                    <option value="wedding">wedding</option>
                    <option value="graduation">graduation</option>
                    <option value="kids">kids</option>
                    <option value="occasion">occasion</option>
                    <option value="creative">creative</option>
                </select>
            </div>
            <div>
                <label for="f-status">상태</label>
                <select id="f-status">
                    <option value="active">active</option>
                    <option value="no_cut">no_cut</option>
                    <option value="burned">burned</option>
                    <option value="">모두</option>
                </select>
            </div>
            <div>
                <label for="f-sort">정렬</label>
                <select id="f-sort">
                    <option value="newest">최신</option>
                    <option value="likes">좋아요</option>
                    <option value="remakes">선택(리메이크)</option>
                    <option value="popularity">크롤 인기도</option>
                    <option value="title">제목</option>
                </select>
            </div>
            <div>
                <label>&nbsp;</label>
                <button class="btn secondary" type="button" id="btn-apply" style="width:100%">적용</button>
            </div>
        </div>

        <div class="meta-bar">
            <span id="meta-count">—</span>
            <span id="meta-status"></span>
        </div>
        <div class="grid" id="grid"></div>
        <div class="pager">
            <button class="btn secondary" type="button" id="btn-prev">이전</button>
            <button class="btn secondary" type="button" id="btn-next">다음</button>
        </div>
    </main>

    <div class="drawer-backdrop hidden" id="drawer">
        <aside class="drawer" id="drawer-panel">
            <div class="top-actions" style="justify-content:space-between;margin-bottom:12px">
                <div class="brand">Detail</div>
                <button class="btn secondary" type="button" id="btn-close">닫기</button>
            </div>
            <h2 id="d-title">—</h2>
            <p class="card-id" id="d-id"></p>
            <img class="drawer-thumb hidden" id="d-thumb" alt="">
            <div class="row">
                <label for="e-title-ko">제목 (ko)</label>
                <input id="e-title-ko" type="text">
            </div>
            <div class="row">
                <label for="e-title-en">제목 (en)</label>
                <input id="e-title-en" type="text">
            </div>
            <div class="row">
                <label for="e-desc-ko">설명 (ko)</label>
                <textarea id="e-desc-ko"></textarea>
            </div>
            <div class="row">
                <label for="e-desc-en">설명 (en)</label>
                <textarea id="e-desc-en"></textarea>
            </div>
            <div class="row">
                <label>Need 카테고리</label>
                <div class="needs" id="e-needs"></div>
            </div>
            <div class="row">
                <label>생성 프롬프트 (normalized)</label>
                <div class="prompt" id="d-norm"></div>
                <button class="btn secondary" type="button" data-copy="d-norm">복사</button>
            </div>
            <div class="row">
                <label>원본 프롬프트 (raw)</label>
                <div class="prompt" id="d-raw"></div>
                <button class="btn secondary" type="button" data-copy="d-raw">복사</button>
            </div>
            <details class="row">
                <summary>negative / meta</summary>
                <div class="prompt" id="d-neg" style="margin-top:8px"></div>
                <p class="stats" id="d-meta" style="margin-top:10px"></p>
            </details>
            <div class="drawer-actions">
                <button class="btn" type="button" id="btn-save">저장</button>
                <button class="btn secondary" type="button" id="btn-regen">컷 재생성</button>
                <button class="btn danger" type="button" id="btn-delete">삭제 (burn)</button>
            </div>
            <div class="err" id="d-err"></div>
        </aside>
    </div>

    <script>
    (function () {
        const SESSION_KEY = "myme_style_dash_ok";
        const PASSWORD = "3121";
        const API_BASE = "https://myme-https.external.intflow.dev/api/corp/style-dashboard";
        const PAGE = 50;
        const NEED_LABELS = ["id","apply","profile","dating","wedding","graduation","kids","occasion","creative"];

        const gate = document.getElementById("gate");
        const dash = document.getElementById("dash");
        const form = document.getElementById("login-form");
        const err = document.getElementById("login-error");
        const grid = document.getElementById("grid");
        const drawer = document.getElementById("drawer");
        const metaCount = document.getElementById("meta-count");
        const metaStatus = document.getElementById("meta-status");

        let offset = 0;
        let total = 0;
        let currentDetail = null;

        function unlocked() { return sessionStorage.getItem(SESSION_KEY) === "1"; }
        function showDash() { gate.classList.add("hidden"); dash.classList.remove("hidden"); loadList(); }
        function showGate() { dash.classList.add("hidden"); drawer.classList.add("hidden"); gate.classList.remove("hidden"); }

        function headers() {
            return { "X-Corp-Dashboard-Password": PASSWORD, "Content-Type": "application/json" };
        }

        async function api(path, opts) {
            const res = await fetch(API_BASE + path, Object.assign({ headers: headers(), cache: "no-store" }, opts || {}));
            const text = await res.text();
            let data = null;
            try { data = text ? JSON.parse(text) : null; } catch (_) { data = { detail: text }; }
            if (!res.ok) {
                const detail = (data && data.detail) ? data.detail : res.status;
                throw new Error(String(detail));
            }
            return data;
        }

        function titleOf(card) {
            const t = card.title || {};
            return t.ko || t.en || card.id || "—";
        }

        function escapeHtml(s) {
            return String(s || "").replace(/[&<>"']/g, function (c) {
                return ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" })[c];
            });
        }

        function renderNeedsEditor(selected) {
            const box = document.getElementById("e-needs");
            const sel = new Set(selected || []);
            box.innerHTML = NEED_LABELS.map(function (n) {
                return '<label class="chip"><input type="checkbox" value="' + n + '"'
                    + (sel.has(n) ? " checked" : "") + "> " + n + "</label>";
            }).join("");
        }

        function selectedNeeds() {
            return Array.prototype.slice.call(document.querySelectorAll("#e-needs input:checked"))
                .map(function (el) { return el.value; });
        }

        function cardHtml(card) {
            const badges = [];
            if (card.is_new) badges.push('<span class="badge new">NEW</span>');
            if (card.status === "burned") badges.push('<span class="badge burned">burned</span>');
            if (!card.has_cut) badges.push('<span class="badge nocut">no cut</span>');
            (card.need_categories || []).slice(0, 2).forEach(function (n) {
                badges.push('<span class="badge">' + escapeHtml(n) + "</span>");
            });
            const img = card.thumb_url
                ? '<img src="' + escapeHtml(card.thumb_url) + '" alt="" loading="lazy" '
                  + 'onerror="this.replaceWith(Object.assign(document.createElement(\'div\'),'
                  + '{className:\'empty\',textContent:\'no image\'}))">'
                : '<div class="empty">no image</div>';
            return (
                '<article class="card" data-id="' + escapeHtml(card.id) + '">'
                + '<div class="thumb-wrap">' + img + '<div class="badges">' + badges.join("") + "</div></div>"
                + '<div class="card-body">'
                + '<h3 class="card-title">' + escapeHtml(titleOf(card)) + "</h3>"
                + '<p class="card-id">' + escapeHtml(card.id) + "</p>"
                + '<div class="stats">'
                + "<span>♥ " + (card.like_count || 0) + "</span>"
                + "<span>선택 " + (card.remake_count || 0) + "</span>"
                + "<span>" + escapeHtml(card.published_at || "—") + "</span>"
                + "</div>"
                + '<div class="card-actions">'
                + '<button class="btn secondary" type="button" data-act="detail">상세/수정</button>'
                + '<button class="btn secondary" type="button" data-act="regen">재생성</button>'
                + '<button class="btn danger" type="button" data-act="delete">삭제</button>'
                + "</div></div></article>"
            );
        }

        async function loadList() {
            metaStatus.textContent = "불러오는 중…";
            const q = document.getElementById("f-q").value.trim();
            const need = document.getElementById("f-need").value;
            const status = document.getElementById("f-status").value;
            const sort = document.getElementById("f-sort").value;
            const params = new URLSearchParams({
                q: q, need: need, status: status, sort: sort,
                offset: String(offset), limit: String(PAGE)
            });
            try {
                const data = await api("/cards?" + params.toString());
                total = data.total || 0;
                metaCount.textContent = "총 " + total + "장 · " + offset + "–" + Math.min(offset + PAGE, total);
                metaStatus.textContent = "";
                grid.innerHTML = (data.cards || []).map(cardHtml).join("") || '<p class="sub">카드가 없습니다.</p>';
            } catch (e) {
                metaStatus.textContent = "오류: " + e.message;
                grid.innerHTML = "";
            }
        }

        async function openDetail(id) {
            document.getElementById("d-err").textContent = "";
            try {
                currentDetail = await api("/cards/" + encodeURIComponent(id));
            } catch (e) {
                alert("상세 로드 실패: " + e.message);
                return;
            }
            document.getElementById("d-title").textContent = titleOf(currentDetail);
            document.getElementById("d-id").textContent = currentDetail.id;
            const thumb = document.getElementById("d-thumb");
            if (currentDetail.thumb_url) {
                thumb.src = currentDetail.thumb_url + (currentDetail.thumb_url.indexOf("?") >= 0 ? "&" : "?") + "t=" + Date.now();
                thumb.classList.remove("hidden");
            } else {
                thumb.classList.add("hidden");
            }
            document.getElementById("e-title-ko").value = (currentDetail.title && currentDetail.title.ko) || "";
            document.getElementById("e-title-en").value = (currentDetail.title && currentDetail.title.en) || "";
            document.getElementById("e-desc-ko").value = (currentDetail.description && currentDetail.description.ko) || "";
            document.getElementById("e-desc-en").value = (currentDetail.description && currentDetail.description.en) || "";
            renderNeedsEditor(currentDetail.need_categories || []);
            document.getElementById("d-norm").textContent = currentDetail.normalized_prompt || "(empty)";
            document.getElementById("d-raw").textContent = currentDetail.raw_prompt || "(empty)";
            document.getElementById("d-neg").textContent = currentDetail.negative_prompt || "(empty)";
            document.getElementById("d-meta").textContent = [
                "status " + (currentDetail.status || ""),
                "♥ " + (currentDetail.like_count || 0),
                "선택 " + (currentDetail.remake_count || 0),
                "crawl " + (currentDetail.popularity_crawl || 0),
                "bucket " + (currentDetail.gallery_bucket || ""),
                "platform " + (currentDetail.platform || ""),
                "published " + (currentDetail.published_at || ""),
                "collected " + (currentDetail.collected_at || ""),
                currentDetail.source_url || ""
            ].join(" · ");
            drawer.classList.remove("hidden");
        }

        async function saveDetail() {
            if (!currentDetail) return;
            const needs = selectedNeeds();
            if (!needs.length) {
                document.getElementById("d-err").textContent = "Need를 하나 이상 선택하세요.";
                return;
            }
            document.getElementById("d-err").textContent = "저장 중…";
            try {
                currentDetail = await api("/cards/" + encodeURIComponent(currentDetail.id), {
                    method: "PATCH",
                    body: JSON.stringify({
                        title: {
                            ko: document.getElementById("e-title-ko").value,
                            en: document.getElementById("e-title-en").value
                        },
                        description: {
                            ko: document.getElementById("e-desc-ko").value,
                            en: document.getElementById("e-desc-en").value
                        },
                        need_categories: needs
                    })
                });
                document.getElementById("d-err").textContent = "저장됨";
                document.getElementById("d-title").textContent = titleOf(currentDetail);
                loadList();
            } catch (e) {
                document.getElementById("d-err").textContent = e.message;
            }
        }

        async function regenCard(id) {
            if (!confirm("갤러리 컷을 재생성할까요? (프롬프트/레시피는 그대로)")) return;
            metaStatus.textContent = "재생성 중… (수 분 걸릴 수 있음)";
            try {
                await api("/cards/" + encodeURIComponent(id) + "/regen", { method: "POST", body: "{}" });
                metaStatus.textContent = "재생성 완료";
                if (currentDetail && currentDetail.id === id) openDetail(id);
                loadList();
            } catch (e) {
                metaStatus.textContent = "재생성 실패: " + e.message;
                alert("재생성 실패: " + e.message);
            }
        }

        async function deleteCard(id) {
            if (!confirm("이 카드를 burn(숨김)할까요? 앱 목록에서 사라집니다.")) return;
            try {
                await api("/cards/" + encodeURIComponent(id) + "/delete", { method: "POST", body: "{}" });
                drawer.classList.add("hidden");
                currentDetail = null;
                loadList();
            } catch (e) {
                alert("삭제 실패: " + e.message);
            }
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const value = document.getElementById("password").value;
            if (value === PASSWORD) {
                sessionStorage.setItem(SESSION_KEY, "1");
                err.textContent = "";
                showDash();
            } else {
                err.textContent = "암호가 올바르지 않습니다.";
            }
        });

        document.getElementById("btn-lock").addEventListener("click", function () {
            sessionStorage.removeItem(SESSION_KEY); showGate();
        });
        document.getElementById("btn-refresh").addEventListener("click", loadList);
        document.getElementById("btn-apply").addEventListener("click", function () { offset = 0; loadList(); });
        document.getElementById("btn-prev").addEventListener("click", function () {
            offset = Math.max(0, offset - PAGE); loadList();
        });
        document.getElementById("btn-next").addEventListener("click", function () {
            if (offset + PAGE < total) { offset += PAGE; loadList(); }
        });
        document.getElementById("btn-close").addEventListener("click", function () {
            drawer.classList.add("hidden");
        });
        drawer.addEventListener("click", function (e) {
            if (e.target === drawer) drawer.classList.add("hidden");
        });
        document.getElementById("btn-save").addEventListener("click", saveDetail);
        document.getElementById("btn-regen").addEventListener("click", function () {
            if (currentDetail) regenCard(currentDetail.id);
        });
        document.getElementById("btn-delete").addEventListener("click", function () {
            if (currentDetail) deleteCard(currentDetail.id);
        });

        grid.addEventListener("click", function (e) {
            const btn = e.target.closest("button[data-act]");
            const card = e.target.closest(".card");
            if (!btn || !card) return;
            const id = card.getAttribute("data-id");
            const act = btn.getAttribute("data-act");
            if (act === "detail") openDetail(id);
            else if (act === "regen") regenCard(id);
            else if (act === "delete") deleteCard(id);
        });

        document.querySelectorAll("[data-copy]").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const el = document.getElementById(btn.getAttribute("data-copy"));
                if (!el) return;
                navigator.clipboard.writeText(el.textContent || "").then(function () {
                    btn.textContent = "복사됨";
                    setTimeout(function () { btn.textContent = "복사"; }, 1200);
                });
            });
        });

        if (unlocked()) showDash();
        else showGate();
    })();
    </script>
</body>
</html>
