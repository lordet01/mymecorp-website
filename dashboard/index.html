<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://mymecorp.xyz/dashboard/">
    <title>myme studio — Ops Dashboard</title>
    <link rel="icon" type="image/x-icon" href="../myme_Design Asset/favicon/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="../myme_Design Asset/favicon/favicon-32x32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="../myme_Design Asset/favicon/apple-touch-icon.png">
    <meta name="theme-color" content="#050506">
    <link rel="stylesheet" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js" defer></script>
    <style>
        :root {
            --studio-rose: #F3C7BE;
            --studio-rose-soft: #F7D5CE;
            --text-dark: #F3F4F6;
            --text-regular: #BCC1CB;
            --text-light: #8E929A;
            --bg: #050506;
            --bg-elevated: #121214;
            --bg-panel: #161619;
            --border: rgba(243, 199, 190, 0.18);
            --ok: #8fd6b5;
            --warn: #e8c07a;
            --font: 'Outfit', 'Pretendard Variable', Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: var(--font);
            background:
                radial-gradient(900px 420px at 12% -10%, rgba(243, 199, 190, 0.14), transparent 55%),
                radial-gradient(700px 380px at 88% 0%, rgba(120, 140, 180, 0.10), transparent 50%),
                var(--bg);
            color: var(--text-dark);
            -webkit-font-smoothing: antialiased;
        }

        a { color: var(--studio-rose); text-decoration: none; }

        .gate, .dash {
            max-width: 1080px;
            margin: 0 auto;
            padding: 48px 20px 72px;
        }

        .gate {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .gate-card {
            width: min(420px, 100%);
            background: linear-gradient(180deg, rgba(243, 199, 190, 0.06), transparent 40%), var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 36px 28px 28px;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
        }

        .brand {
            font-size: 13px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--studio-rose);
            font-weight: 700;
            margin-bottom: 10px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: clamp(1.6rem, 3vw, 2rem);
            font-weight: 700;
            letter-spacing: -0.02em;
        }

        .sub {
            margin: 0 0 28px;
            color: var(--text-regular);
            font-size: 0.95rem;
            line-height: 1.55;
        }

        label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-light);
            margin-bottom: 8px;
        }

        input[type="password"] {
            width: 100%;
            border: 1px solid var(--border);
            background: #0b0b0d;
            color: var(--text-dark);
            border-radius: 12px;
            padding: 14px 16px;
            font: inherit;
            font-size: 1rem;
            outline: none;
        }

        input[type="password"]:focus {
            border-color: rgba(243, 199, 190, 0.55);
            box-shadow: 0 0 0 3px rgba(243, 199, 190, 0.12);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-top: 16px;
            border: 0;
            border-radius: 999px;
            padding: 14px 18px;
            background: linear-gradient(135deg, #F7D5CE 0%, #F3C7BE 45%, #E8B8B0 100%);
            color: #1a1210;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:hover { filter: brightness(1.04); }
        .btn.secondary {
            width: auto;
            background: transparent;
            color: var(--text-regular);
            border: 1px solid var(--border);
            padding: 8px 14px;
            font-size: 0.85rem;
            font-weight: 500;
        }

        .err {
            min-height: 1.2em;
            margin-top: 12px;
            color: #f0a0a0;
            font-size: 0.88rem;
        }

        .hidden { display: none !important; }

        .top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 28px;
            flex-wrap: wrap;
        }

        .kpis {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            margin-bottom: 22px;
        }

        .kpi {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px 18px;
            min-height: 120px;
        }

        .kpi .label {
            color: var(--text-light);
            font-size: 0.78rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 10px;
        }

        .kpi .value {
            font-size: clamp(1.6rem, 3.2vw, 2.15rem);
            font-weight: 750;
            letter-spacing: -0.03em;
            line-height: 1.1;
        }

        .kpi .hint {
            margin-top: 10px;
            color: var(--text-light);
            font-size: 0.8rem;
        }

        .panel {
            background: var(--bg-panel);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .panel h2 {
            margin: 0 0 16px;
            font-size: 1.05rem;
            font-weight: 650;
        }

        .chart-wrap {
            position: relative;
            height: 280px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.92rem;
        }

        th, td {
            text-align: right;
            padding: 12px 10px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
        }

        th:first-child, td:first-child { text-align: left; }

        th {
            color: var(--text-light);
            font-weight: 500;
            font-size: 0.78rem;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        td { color: var(--text-regular); }
        td.num { color: var(--text-dark); font-variant-numeric: tabular-nums; }

        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 10px 18px;
            color: var(--text-light);
            font-size: 0.82rem;
            margin-top: 8px;
        }

        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 999px;
            border: 1px solid var(--border);
            color: var(--studio-rose-soft);
            font-size: 0.72rem;
        }

        .notes {
            margin: 0;
            padding-left: 18px;
            color: var(--text-light);
            font-size: 0.82rem;
            line-height: 1.55;
        }

        @media (max-width: 800px) {
            .kpis { grid-template-columns: 1fr; }
            .chart-wrap { height: 240px; }
            table { font-size: 0.84rem; }
            th, td { padding: 10px 6px; }
        }
    </style>
</head>
<body>
    <section id="gate" class="gate">
        <div class="gate-card">
            <div class="brand">myme studio</div>
            <h1>Ops Dashboard</h1>
            <p class="sub">다운로드·구매 성과와 OpenAI 지출을 월 단위로 확인합니다.</p>
            <form id="login-form">
                <label for="password">암호</label>
                <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
                <button class="btn" type="submit">입장</button>
                <div id="login-error" class="err" aria-live="polite"></div>
            </form>
        </div>
    </section>

    <main id="dash" class="dash hidden">
        <div class="top">
            <div>
                <div class="brand">myme studio</div>
                <h1>Ops Dashboard</h1>
                <p class="sub" style="margin-bottom:0">총 수익 · 총 다운로드 · 총 OpenAI 지출</p>
            </div>
            <button type="button" class="btn secondary" id="logout">잠금</button>
        </div>

        <div class="kpis">
            <article class="kpi">
                <div class="label">총 수익</div>
                <div class="value" id="kpi-revenue">—</div>
                <div class="hint" id="kpi-purchases">구매 —건</div>
            </article>
            <article class="kpi">
                <div class="label">총 다운로드</div>
                <div class="value" id="kpi-downloads">—</div>
                <div class="hint">앱 신고 설치(디바이스)</div>
            </article>
            <article class="kpi">
                <div class="label">총 지출 · OpenAI</div>
                <div class="value" id="kpi-openai">—</div>
                <div class="hint" id="kpi-openai-src">—</div>
            </article>
        </div>

        <section class="panel">
            <h2>월별 추이</h2>
            <div class="chart-wrap">
                <canvas id="chart"></canvas>
            </div>
        </section>

        <section class="panel">
            <h2>월별 상세</h2>
            <div style="overflow-x:auto">
                <table>
                    <thead>
                        <tr>
                            <th>월</th>
                            <th>다운로드</th>
                            <th>구매</th>
                            <th>수익 (USD)</th>
                            <th>OpenAI (USD)</th>
                        </tr>
                    </thead>
                    <tbody id="month-rows"></tbody>
                </table>
            </div>
            <div class="meta">
                <span>업데이트 <span id="updated-at">—</span></span>
                <span class="badge" id="data-source">—</span>
            </div>
        </section>

        <section class="panel">
            <h2>데이터 기준</h2>
            <ul class="notes" id="notes"></ul>
        </section>
    </main>

    <script>
    (function () {
        const SESSION_KEY = "myme_corp_dash_ok";
        const PASSWORD = "3121";
        const API_URLS = [
            "https://myme-https.external.intflow.dev/api/corp/dashboard/metrics",
            "./metrics.json"
        ];

        const gate = document.getElementById("gate");
        const dash = document.getElementById("dash");
        const form = document.getElementById("login-form");
        const err = document.getElementById("login-error");
        let chart;

        function unlocked() {
            return sessionStorage.getItem(SESSION_KEY) === "1";
        }

        function showDash() {
            gate.classList.add("hidden");
            dash.classList.remove("hidden");
            loadMetrics();
        }

        function showGate() {
            dash.classList.add("hidden");
            gate.classList.remove("hidden");
        }

        function fmtMoney(n) {
            const v = Number(n) || 0;
            return "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function fmtInt(n) {
            return (Number(n) || 0).toLocaleString("en-US");
        }

        async function fetchMetrics() {
            const password = PASSWORD;
            let lastErr = null;
            for (const url of API_URLS) {
                try {
                    const headers = {};
                    if (!url.endsWith(".json")) {
                        headers["X-Corp-Dashboard-Password"] = password;
                    }
                    const res = await fetch(url, { headers, cache: "no-store" });
                    if (!res.ok) throw new Error(url + " " + res.status);
                    const data = await res.json();
                    data._source = url.endsWith(".json") ? "snapshot" : "live";
                    return data;
                } catch (e) {
                    lastErr = e;
                }
            }
            throw lastErr || new Error("no metrics");
        }

        function render(data) {
            const totals = data.totals || {};
            const monthly = Array.isArray(data.monthly) ? data.monthly.slice() : [];
            monthly.sort((a, b) => String(a.month).localeCompare(String(b.month)));

            document.getElementById("kpi-revenue").textContent = fmtMoney(totals.revenue_usd);
            document.getElementById("kpi-downloads").textContent = fmtInt(totals.downloads);
            document.getElementById("kpi-openai").textContent = fmtMoney(totals.openai_cost_usd);
            document.getElementById("kpi-purchases").textContent = "구매 " + fmtInt(totals.purchases) + "건";

            const src = (monthly[0] && monthly[0].openai_cost_source) || "—";
            document.getElementById("kpi-openai-src").textContent =
                src === "openai_admin" ? "OpenAI 청구 실적" : "추정(생성 건수 × 단가)";

            document.getElementById("updated-at").textContent = data.updated_at || "—";
            document.getElementById("data-source").textContent =
                data._source === "live" ? "Live API" : "Local snapshot";

            const notes = data.notes || {};
            const ul = document.getElementById("notes");
            ul.innerHTML = "";
            Object.keys(notes).forEach(function (k) {
                const li = document.createElement("li");
                li.textContent = k + ": " + notes[k];
                ul.appendChild(li);
            });

            const tbody = document.getElementById("month-rows");
            tbody.innerHTML = "";
            monthly.slice().reverse().forEach(function (row) {
                const tr = document.createElement("tr");
                tr.innerHTML =
                    "<td>" + row.month + "</td>" +
                    "<td class='num'>" + fmtInt(row.downloads) + "</td>" +
                    "<td class='num'>" + fmtInt(row.purchases) + "</td>" +
                    "<td class='num'>" + fmtMoney(row.revenue_usd) + "</td>" +
                    "<td class='num'>" + fmtMoney(row.openai_cost_usd) + "</td>";
                tbody.appendChild(tr);
            });

            const labels = monthly.map(function (r) { return r.month; });
            const dl = monthly.map(function (r) { return Number(r.downloads) || 0; });
            const rev = monthly.map(function (r) { return Number(r.revenue_usd) || 0; });
            const buy = monthly.map(function (r) { return Number(r.purchases) || 0; });
            const oai = monthly.map(function (r) { return Number(r.openai_cost_usd) || 0; });

            const ctx = document.getElementById("chart");
            if (chart) chart.destroy();
            if (typeof Chart === "undefined") return;
            chart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: labels,
                    datasets: [
                        {
                            type: "bar",
                            label: "Downloads",
                            data: dl,
                            yAxisID: "y",
                            backgroundColor: "rgba(243, 199, 190, 0.55)",
                            borderRadius: 6,
                            order: 2
                        },
                        {
                            type: "line",
                            label: "Purchases",
                            data: buy,
                            yAxisID: "y",
                            borderColor: "#8fd6b5",
                            backgroundColor: "transparent",
                            tension: 0.25,
                            order: 1
                        },
                        {
                            type: "line",
                            label: "Revenue USD",
                            data: rev,
                            yAxisID: "y1",
                            borderColor: "#F3C7BE",
                            backgroundColor: "transparent",
                            tension: 0.25,
                            order: 0
                        },
                        {
                            type: "line",
                            label: "OpenAI USD",
                            data: oai,
                            yAxisID: "y1",
                            borderColor: "#e8c07a",
                            borderDash: [5, 4],
                            backgroundColor: "transparent",
                            tension: 0.25,
                            order: 0
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: "index", intersect: false },
                    plugins: {
                        legend: {
                            labels: { color: "#BCC1CB", boxWidth: 12, font: { family: "Outfit" } }
                        }
                    },
                    scales: {
                        x: {
                            ticks: { color: "#8E929A" },
                            grid: { color: "rgba(255,255,255,0.04)" }
                        },
                        y: {
                            position: "left",
                            ticks: { color: "#8E929A" },
                            grid: { color: "rgba(255,255,255,0.06)" },
                            title: { display: true, text: "Count", color: "#8E929A" }
                        },
                        y1: {
                            position: "right",
                            ticks: { color: "#8E929A" },
                            grid: { drawOnChartArea: false },
                            title: { display: true, text: "USD", color: "#8E929A" }
                        }
                    }
                }
            });
        }

        async function loadMetrics() {
            try {
                const data = await fetchMetrics();
                render(data);
            } catch (e) {
                document.getElementById("notes").innerHTML =
                    "<li>지표를 불러오지 못했습니다. API 또는 metrics.json을 확인하세요.</li>";
            }
        }

        form.addEventListener("submit", function (e) {
            e.preventDefault();
            const value = (document.getElementById("password").value || "").trim();
            if (value === PASSWORD) {
                sessionStorage.setItem(SESSION_KEY, "1");
                err.textContent = "";
                showDash();
            } else {
                err.textContent = "암호가 올바르지 않습니다.";
            }
        });

        document.getElementById("logout").addEventListener("click", function () {
            sessionStorage.removeItem(SESSION_KEY);
            showGate();
        });

        if (unlocked()) showDash();
    })();
    </script>
</body>
</html>
