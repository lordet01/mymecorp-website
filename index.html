<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>myme | AI 증명사진 & 프로필</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6366f1; /* 세련된 인디고 퍼플 (AI 서비스 느낌) */
            --text-dark: #1f2937;
            --text-light: #6b7280;
            --bg-light: #f9fafb;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0; padding: 0;
            background-color: #ffffff;
            color: var(--text-dark);
            word-break: keep-all;
        }

        /* 헤더/로고 영역 */
        header {
            padding: 40px 20px;
            text-align: center;
        }
        .logo-text {
            font-size: 1.8rem;
            font-weight: 900;
            color: var(--primary-color);
            letter-spacing: -1px;
        }

        /* 메인 섹션 */
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 0 20px 80px;
            text-align: center;
        }

        .badge {
            display: inline-block;
            background-color: #eef2ff;
            color: var(--primary-color);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 2.5rem;
            line-height: 1.2;
            margin-bottom: 20px;
            font-weight: 800;
        }

        .highlight {
            color: var(--primary-color);
        }

        p.description {
            font-size: 1.15rem;
            color: var(--text-light);
            line-height: 1.6;
            margin-bottom: 40px;
        }

        /* 이미지/기능 강조 박스 */
        .feature-box {
            background-color: var(--bg-light);
            border-radius: 24px;
            padding: 40px 20px;
            margin-bottom: 50px;
            border: 1px solid #f1f1f1;
        }

        .feature-text {
            font-size: 1rem;
            color: var(--text-dark);
            font-weight: 600;
        }

        /* 하단 정보 */
        .contact {
            font-size: 0.95rem;
            color: var(--text-dark);
            text-decoration: none;
            font-weight: 700;
        }

        footer {
            margin-top: 100px;
            padding: 40px 20px;
            background-color: var(--bg-light);
            font-size: 0.8rem;
            color: #9ca3af;
            line-height: 1.8;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-text">myme</div>
    </header>

    <div class="container">
        <div class="badge">모바일 앱 전용 서비스</div>
        
        <h1>AI 증명사진, <br><span class="highlight">앱에서 더 완벽하게</span></h1>
        
        <p class="description">
            셀카 한 장으로 스튜디오급 프로필 사진!<br>
            의상 · 헤어 · 배경을 자유롭게 바꾸고<br>
            고화질로 바로 다운로드하세요.
        </p>

        <div class="feature-box">
            <div class="feature-text">
                🚀 2026년 상반기 Google Play & App Store 출시 예정
            </div>
        </div>

        <div>
            <a href="mailto:info@mymecorp.xyz" class="contact">문의하기: info@mymecorp.xyz</a>
        </div>
    </div>

    <footer>
        <strong>MYME Corp. OÜ</strong><br>
        Lõõtsa tn 5, Tallinn, 11415, Estonia.<br>
        © 2026 myme. All rights reserved.
    </footer>

</body>
</html>
